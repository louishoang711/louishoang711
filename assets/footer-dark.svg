<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" role="img" aria-label="Footer - From wireless packets to alerts I can investigate">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="50%" stop-color="#0B1622"/>
      <stop offset="100%" stop-color="#071B18"/>
    </linearGradient>
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC">
        <animate attributeName="stop-color" values="#F8FAFC;#A7F3D0;#7DD3FC;#F8FAFC" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A7F3D0">
        <animate attributeName="stop-color" values="#A7F3D0;#7DD3FC;#F8FAFC;#A7F3D0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7DD3FC">
        <animate attributeName="stop-color" values="#7DD3FC;#F8FAFC;#A7F3D0;#7DD3FC" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect x="0" y="0" width="900" height="110" rx="14"/>
    </clipPath>
  </defs>
  <style>
    @font-face {
      font-family: 'CormorantFoot';
      font-style: italic;
      font-weight: 600;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    @font-face {
      font-family: 'CinzelSign';
      font-style: normal;
      font-weight: 600;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    .quote {
      font-family: 'CormorantFoot', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: 0.6px;
    }
    .sign {
      font-family: 'CinzelSign', 'Cinzel', Georgia, serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 3.2px;
      fill: #64748B;
    }
    .wave1 { stroke-dasharray: 16 10; animation: flow 3.6s linear infinite; }
    .wave2 { stroke-dasharray: 10 12; animation: flowRev 4.6s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 52; } to { stroke-dashoffset: 0; } }
    @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 44; } }
  </style>
  <g clip-path="url(#footClip)">
    <rect x="0" y="0" width="900" height="110" fill="url(#footBg)"/>
    <path class="wave1" d="M 0 18 Q 225 4 450 18 T 900 18" fill="none" stroke="url(#waveStroke)" stroke-width="1.5"/>
    <path class="wave2" d="M 0 92 Q 225 106 450 92 T 900 92" fill="none" stroke="url(#waveStroke)" stroke-width="1.3" opacity="0.6"/>
    <text x="450" y="54" text-anchor="middle" class="quote" fill="url(#quoteGrad)">"From wireless packets to alerts I can investigate."</text>
    <text x="450" y="79" text-anchor="middle" class="sign">LOUIS · KHANG HOANG PHUC · SECURITY OPERATIONS</text>
    <rect x="0.75" y="0.75" width="898.5" height="108.5" rx="13.5" fill="none" stroke="#34D399" stroke-opacity="0.22" stroke-width="1.2"/>
  </g>
</svg>