<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" role="img" aria-label="Louis - Khang Hoang Phuc - Security Operations and Blue Team">
  <defs>
    <!-- Deep obsidian cyber-SOC background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="52%" stop-color="#0B1622"/>
      <stop offset="100%" stop-color="#071B18"/>
    </linearGradient>

    <!-- Animated holographic gradient for main title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0">
        <animate attributeName="stop-color" values="#A7F3D0;#38BDF8;#34D399;#818CF8;#A7F3D0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#A7F3D0;#38BDF8;#34D399;#34D399" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#A7F3D0;#38BDF8;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft ambient glow -->
    <radialGradient id="ambientGlow" cx="25%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070B12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070B12" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#34D399" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Neon text glow filter -->
    <filter id="neonGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="270" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title-main {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 74px;
      letter-spacing: 10px;
    }
    .title-glitch-cyan {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 74px;
      letter-spacing: 10px;
      fill: #38BDF8;
      opacity: 0;
      animation: glitchCyan 5.5s infinite;
    }
    .title-glitch-mint {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 74px;
      letter-spacing: 10px;
      fill: #34D399;
      opacity: 0;
      animation: glitchMint 5.5s infinite;
    }
    .title-stroke {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 74px;
      letter-spacing: 10px;
      fill: none;
      stroke: #A7F3D0;
      stroke-width: 1.2;
      stroke-dasharray: 42 180;
      stroke-opacity: 0.85;
      animation: edgeShimmer 4.5s linear infinite;
    }
    @keyframes edgeShimmer {
      from { stroke-dashoffset: 222; }
      to { stroke-dashoffset: 0; }
    }
    .subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #94A3B8;
      animation: subBreath 4s ease-in-out infinite;
    }
    @keyframes subBreath {
      0%, 100% { fill: #94A3B8; letter-spacing: 3.5px; }
      50% { fill: #CBD5E1; letter-spacing: 4.1px; }
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace;
    }
    .cursor {
      animation: blink 1s steps(2, start) infinite;
    }
    .pulse-dot {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    .scan-bar {
      animation: scanMove 6s linear infinite;
    }
    .radar-sweep {
      transform-origin: 740px 135px;
      animation: spin 7s linear infinite;
    }
    .wave-flow {
      stroke-dasharray: 12 8;
      animation: dashFlow 2.4s linear infinite;
    }
    .float-slow {
      animation: floatY 4.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.82); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-20px); opacity: 0; }
      10% { opacity: 0.45; }
      90% { opacity: 0.45; }
      100% { transform: translateY(290px); opacity: 0; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes glitchCyan {
      0%, 88%, 100% { opacity: 0; transform: translate(0, 0); }
      89% { opacity: 0.55; transform: translate(-3px, -1px); }
      91% { opacity: 0; transform: translate(0, 0); }
      92% { opacity: 0.4; transform: translate(2px, 1px); }
      94% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes glitchMint {
      0%, 88%, 100% { opacity: 0; transform: translate(0, 0); }
      90% { opacity: 0.5; transform: translate(3px, 1px); }
      92% { opacity: 0; transform: translate(0, 0); }
      93% { opacity: 0.35; transform: translate(-2px, -1px); }
      95% { opacity: 0; transform: translate(0, 0); }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Base canvas -->
    <rect x="0" y="0" width="900" height="270" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#cyberGrid)"/>
    <rect x="0" y="0" width="900" height="270" fill="url(#ambientGlow)"/>

    <!-- Subtle moving scanline -->
    <rect class="scan-bar" x="0" y="0" width="900" height="2" fill="url(#lineGrad)"/>

    <!-- Decorative corner HUD brackets -->
    <path d="M 22 40 L 22 22 L 40 22" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.65"/>
    <path d="M 878 40 L 878 22 L 860 22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.65"/>
    <path d="M 22 230 L 22 248 L 40 248" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.65"/>
    <path d="M 878 230 L 878 248 L 860 248" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.65"/>

    <!-- Top status badge -->
    <g transform="translate(52, 36)">
      <rect x="0" y="0" width="212" height="26" rx="13" fill="#0F1D2B" stroke="#34D399" stroke-opacity="0.4" stroke-width="1"/>
      <circle class="pulse-dot" cx="16" cy="13" r="4" fill="#34D399" filter="url(#softGlow)" style="transform-origin: 16px 13px;"/>
      <text x="29" y="17" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#A7F3D0">BLUE TEAM · SOC ACTIVE</text>
    </g>

    <!-- Coordinates top-right (clear of radar) -->
    <text x="854" y="38" text-anchor="end" class="mono" font-size="10" letter-spacing="1.4" fill="#64748B">10.8505° N · 106.7717° E // HCMC</text>

    <!-- Hero Glitch + Animated Gradient + Edge-Shimmer Typography -->
    <g transform="translate(52, 146)">
      <text class="title-glitch-cyan" x="0" y="0">LOUIS</text>
      <text class="title-glitch-mint" x="0" y="0">LOUIS</text>
      <text class="title-main" x="0" y="0" fill="url(#titleGrad)" filter="url(#neonGlow)">LOUIS</text>
      <text class="title-stroke" x="0" y="0">LOUIS</text>
    </g>

    <!-- Subtitle with subtle animated breathing tracking -->
    <text x="55" y="178" class="subtitle">KHANG HOANG PHUC  ·  @LOUISHOANG711</text>

    <!-- Accent glowing divider -->
    <rect x="52" y="192" width="466" height="2" fill="url(#lineGrad)" rx="1"/>

    <!-- Animated terminal prompt pill -->
    <g transform="translate(52, 208)">
      <rect x="0" y="0" width="466" height="32" rx="8" fill="#0A131E" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="20" class="mono" font-size="12.5" font-weight="600" fill="#34D399">$</text>
      <text x="29" y="20" class="mono" font-size="12.5" fill="#CBD5E1">whoami</text>
      <text x="86" y="20" class="mono" font-size="12.5" fill="#38BDF8">▸</text>
      <text x="104" y="20" class="mono" font-size="12.5" fill="#E2E8F0">Security Operations · Packet Triage · HCMUTE</text>
      <rect class="cursor" x="444" y="9" width="8" height="14" rx="1.5" fill="#34D399"/>
    </g>

    <!-- Right-side animated SOC Radar / Telemetry Graphic -->
    <g>
      <circle cx="740" cy="135" r="88" fill="url(#radarGlow)"/>
      <circle cx="740" cy="135" r="78" fill="none" stroke="#34D399" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="740" cy="135" r="54" fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1"/>
      <circle cx="740" cy="135" r="30" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="1"/>

      <!-- Crosshairs -->
      <line x1="652" y1="135" x2="828" y2="135" stroke="#34D399" stroke-opacity="0.18" stroke-width="1"/>
      <line x1="740" y1="47" x2="740" y2="223" stroke="#34D399" stroke-opacity="0.18" stroke-width="1"/>

      <!-- Rotating radar sweep sector -->
      <g class="radar-sweep">
        <path d="M 740 135 L 740 57 A 78 78 0 0 1 807 96 Z" fill="#34D399" fill-opacity="0.18"/>
        <line x1="740" y1="135" x2="740" y2="57" stroke="#34D399" stroke-width="1.8" filter="url(#softGlow)"/>
      </g>

      <!-- Detected packet blips -->
      <circle class="pulse-dot" cx="776" cy="102" r="3.5" fill="#38BDF8" filter="url(#softGlow)" style="transform-origin: 776px 102px;"/>
      <circle class="pulse-dot" cx="702" cy="166" r="3" fill="#34D399" filter="url(#softGlow)" style="transform-origin: 702px 166px; animation-delay: 0.7s;"/>
      <circle class="pulse-dot" cx="784" cy="158" r="2.8" fill="#A7F3D0" style="transform-origin: 784px 158px; animation-delay: 1.3s;"/>

      <!-- Center shield glyph -->
      <g class="float-slow" transform="translate(740, 135)">
        <path d="M 0 -16 L 13 -10 L 13 1 C 13 9 7 15 0 18 C -7 15 -13 9 -13 1 L -13 -10 Z" fill="#0B1622" stroke="#34D399" stroke-width="2" filter="url(#softGlow)"/>
        <path d="M -5 1 L -1 5 L 6 -4" fill="none" stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Telemetry caption under radar -->
      <text x="740" y="238" text-anchor="middle" class="mono" font-size="10" letter-spacing="1.6" fill="#64748B">TSHARK ▸ WAZUH ▸ ALERT</text>
    </g>

    <!-- Animated signal wave along bottom edge -->
    <path class="wave-flow" d="M 0 264 Q 150 256 300 264 T 600 264 T 900 264" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.7"/>

    <!-- Outer border -->
    <rect x="0.75" y="0.75" width="898.5" height="268.5" rx="15.5" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
</svg>
