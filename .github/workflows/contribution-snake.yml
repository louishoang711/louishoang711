name: Contribution Snake

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/contribution-snake.yml
  schedule:
    - cron: '31 18 * * *'

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snake:
    if: github.repository == 'louishoang711/louishoang711' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: louishoang711
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%230284c7&color_dots=%23f1f5f9,%23bbf7d0,%236ee7b7,%2310b981,%23047857
            dist/snake-dark.svg?palette=github-dark&color_snake=%2338bdf8&color_dots=%230f172a,%23064e3b,%23047857,%2310b981,%2334d399
      - name: Publish animated images
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: snake-output
          publish_dir: ./dist
          enable_jekyll: true
